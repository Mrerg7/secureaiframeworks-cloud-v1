name = "secureaiframeworks-cloud-v1"
main = "src/worker.ts"
compatibility_date = "2026-08-17"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[routes]]
pattern = "secureaiframeworks.cloud"
custom_domain = true
